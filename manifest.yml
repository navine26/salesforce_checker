modules:
  jira:issuePanel:
    - key: salesforce-checker-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: large
      title: Salesforce Checker
      location: atl.jira.view.issue.right.context
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  external:
    fetch:
      backend:
        - 'https://vignesa.app.n8n.cloud'
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/63827d68-0ab1-490b-9389-c1ac8b6ae5cb
